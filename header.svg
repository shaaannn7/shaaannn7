<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="45%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D8FF"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="white">
    <circle cx="55"  cy="22" r="1.5" opacity="0.7"><animate attributeName="opacity" values="0.7;1;0.3;1;0.7"   dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="14" r="1"   opacity="0.5"><animate attributeName="opacity" values="0.5;1;0.2;0.8;0.5" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="38" r="1.5" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;1;0.6"     dur="4.0s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="18" r="1"   opacity="0.8"><animate attributeName="opacity" values="0.8;0.3;1;0.8"     dur="2.0s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="28" r="1.5" opacity="0.5"><animate attributeName="opacity" values="0.5;1;0.4;0.9;0.5" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="13" r="1"   opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;1;0.7"     dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="42" r="1.5" opacity="0.4"><animate attributeName="opacity" values="0.4;1;0.6;0.4"     dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="58" r="1"   opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.2;0.6"     dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="52" r="1.5" opacity="0.7"><animate attributeName="opacity" values="0.7;0.3;1;0.7"     dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="55" r="1"   opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.2;0.5"   dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="20" r="1"   opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;1;0.6"     dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="25"  cy="60" r="1.5" opacity="0.4"><animate attributeName="opacity" values="0.4;0.9;0.4"       dur="5.0s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Wave back (slow) -->
  <path fill="rgba(0,216,255,0.10)">
    <animate attributeName="d"
      values="M0,155 C100,135 200,175 300,155 C400,135 500,175 600,155 C700,135 800,175 900,155 L900,200 L0,200 Z;
              M0,165 C100,155 200,165 300,175 C400,155 500,165 600,175 C700,155 800,165 900,175 L900,200 L0,200 Z;
              M0,155 C100,135 200,175 300,155 C400,135 500,175 600,155 C700,135 800,175 900,155 L900,200 L0,200 Z"
      dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Wave front (fast) -->
  <path fill="rgba(0,216,255,0.18)">
    <animate attributeName="d"
      values="M0,170 C150,150 300,190 450,170 C600,150 750,190 900,170 L900,200 L0,200 Z;
              M0,178 C150,168 300,178 450,185 C600,168 750,182 900,178 L900,200 L0,200 Z;
              M0,170 C150,150 300,190 450,170 C600,150 750,190 900,170 L900,200 L0,200 Z"
      dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- Title -->
  <text x="450" y="102" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="64" font-weight="bold" letter-spacing="6"
        fill="url(#tg)" filter="url(#glow)">
    Shaan
    <animate attributeName="opacity" values="1;0.88;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="450" y="138" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="14" letter-spacing="2.5"
        fill="rgba(255,255,255,0.72)">
    AI &amp; Data Science · Full-Stack Developer
  </text>
</svg>
